# Schema: https://camp-registry.org/schema/listing.schema.json
name: tool_bulkcleaning
summary: Tool to automate bulk cleaning data on the platform in operations through scheduled tasks.
description: |
  Bulk cleaning tool for Moodle, designed to automate the process of cleaning up data on the platform. It provides scheduled tasks to perform various cleaning operations, ensuring that the system remains efficient and free from unnecessary clutter. This tool is particularly useful for administrators who need to maintain a clean and organized Moodle environment. Actually the tool provides three cleaning operations: Enrolments, Users and OAuth2 data cleaning.
labels:
- fully-free
- donation-supported
- commercial-support-available
category: tool
screenshots:
  - path: .camp/screenshots/bulkcleaning_tabs.png
    caption: The tool provides three cleaning operations - Enrolments, Users and OAuth2 data cleaning.
  - path: .camp/screenshots/bulkcleaning_report.png
    caption: The tool provides a report for each cleaning operation.
  - path: .camp/screenshots/bulkcleaning_cli.png
    caption: The tool provides a CLI command to analyze or export data before cleaning.
